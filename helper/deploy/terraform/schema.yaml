title: "OCI Ultimate Migration Tool"
description: >
  Deploys the OCI Ultimate Migration Tool for VM migration, image import/export, ISO installation
  and remote console access, with supporting networking, storage and IAM resources.
schemaVersion: 1.1.0
version: "0.2.0"
locale: "en"

variableGroups:
  - title: "Placement"
    variables:
      - compartment_ocid
      - availability_domain
  - title: "Network"
    variables:
      - network_compartment_ocid
      - vcn_ocid
      - subnet_ocid
      - assign_public_ip
      - allowed_source_cidrs
  - title: "OCI Migration Tool VM"
    variables:
      - helper_display_name
      - helper_shape
      - helper_ocpus
      - helper_memory_gb
      - ssh_public_key
  - title: "Migration tool service"
    variables:
      - source_git_url
      - source_git_ref
      - seed_bucket_name
      - default_target_shape
      - max_concurrent_jobs
  - title: "IAM"
    variables:
      - create_iam
      - policy_scope_compartment_ocid
  - title: "Hidden"
    visible: false
    variables:
      - tenancy_ocid
      - region

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Compartment for the OCI Migration Tool VM, the seed bucket and seed images"
    required: true

  availability_domain:
    type: oci:identity:availabilitydomain:name
    title: "Availability domain"
    description: "Migrated instances can only be created in this AD"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}

  network_compartment_ocid:
    type: oci:identity:compartment:id
    title: "Network compartment"
    description: "Compartment of the VCN and subnet; the network security group is created there too. Defaults to the placement compartment."
    default: ${compartment_ocid}
    required: true

  vcn_ocid:
    type: oci:core:vcn:id
    title: "VCN"
    required: true
    dependsOn:
      compartmentId: ${network_compartment_ocid}

  subnet_ocid:
    type: oci:core:subnet:id
    title: "Subnet"
    description: "Must route to vCenter (VPN/FastConnect) and be reachable from the administrators' browsers"
    required: true
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${vcn_ocid}
      hidePublicSubnet: false
      hidePrivateSubnet: false

  assign_public_ip:
    type: boolean
    title: "Assign a public IP"
    default: false

  allowed_source_cidrs:
    type: array
    items:
      type: string
      pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    title: "Allowed source CIDRs"
    description: "Networks allowed to reach the web UI (8443) and SSH (22), typically the administrators' networks"
    required: true
    minItems: 1
    uniqueItems: true

  helper_display_name:
    type: string
    title: "Instance name"
    default: "oci-migration-tool"
    pattern: "^[a-zA-Z][a-zA-Z0-9-]{0,62}$"

  helper_shape:
    type: oci:core:instanceshape:name
    title: "Shape"
    default: "VM.Standard.E5.Flex"
    dependsOn:
      compartmentId: ${compartment_ocid}
      availabilityDomain: ${availability_domain}

  helper_ocpus:
    type: number
    title: "OCPUs"
    default: 2
    minimum: 1
    maximum: 16

  helper_memory_gb:
    type: number
    title: "Memory (GB)"
    default: 16
    minimum: 4
    maximum: 256

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH public key"
    required: true

  source_git_url:
    type: string
    title: "Git repository URL"
    description: "HTTPS URL of the migration tool repository (must be reachable from the OCI Migration Tool VM); cloned and installed with pip"
    default: "https://github.com/RichardORCL/OCI-UltimateMigrationTool.git"
    required: true

  source_git_ref:
    type: string
    title: "Git branch / tag / commit"
    default: "main"

  seed_bucket_name:
    type: string
    title: "Seed image bucket"
    default: "oci-umt-seed-images"
    pattern: "^[a-zA-Z0-9_.-]{1,256}$"

  default_target_shape:
    type: string
    title: "Default shape for migrated instances"
    default: "VM.Standard.E5.Flex"

  max_concurrent_jobs:
    type: number
    title: "Parallel migrations"
    default: 2
    minimum: 1
    maximum: 8

  create_iam:
    type: boolean
    title: "Create IAM resources"
    description: "Dynamic group, policy and the UltimateMigrationTool tag namespace (requires administrator rights in the tenancy root)"
    default: true

  policy_scope_compartment_ocid:
    type: oci:identity:compartment:id
    title: "Limit target compartment"
    description: "Restrict where the migration tool may create instances and volumes (empty = whole tenancy)"
    visible: ${create_iam}

  tenancy_ocid:
    type: string
  region:
    type: string

outputGroups:
  - title: "Get started"
    outputs:
      - helper_ui_url
      - availability_domain
      - next_steps
  - title: "Resources"
    outputs:
      - helper_instance_id
      - helper_private_ip
      - helper_public_ip
      - seed_bucket

outputs:
  helper_ui_url:
    type: link
    title: "OCI Ultimate Migration Tool web UI"
  availability_domain:
    type: string
    title: "Availability domain for migrated instances"
  next_steps:
    type: string
    title: "Next steps"
  helper_instance_id:
    type: ocid
    title: "OCI Migration Tool VM"
  helper_private_ip:
    type: string
    title: "Private IP"
  helper_public_ip:
    type: string
    title: "Public IP"
  seed_bucket:
    type: string
    title: "Seed image bucket"
